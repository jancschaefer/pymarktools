[package]
name = "pymarktools-core"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"

[lib]
name = "pymarktools_core"
path = "src/lib.rs"

[dependencies]
globset = "0.4"
ignore = "0.4"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
toml = "0.8"
